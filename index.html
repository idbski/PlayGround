<html lang="en">
<head>

<title>NOCTURNE — The Veil of Ash</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--ink:#090a0d;--panel:#111216;--line:#302a28;--muted:#9a918a;--cream:#e9dfd0;--red:#a73b35;--gold:#c7a46d;--green:#718879}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}#app{min-height:100vh}.screen{min-height:100vh;position:relative;overflow:hidden}.landing{display:grid;grid-template-columns:1.04fr .96fr;background:radial-gradient(ellipse at 75% 40%,#252023 0,#101014 42%,#090a0d 75%)}.cover-art{position:absolute;inset:0 0 0 48%;overflow:hidden;background:linear-gradient(90deg,#090a0d 0%,transparent 23%),linear-gradient(0deg,#090a0d 0%,transparent 37%),linear-gradient(180deg,#090a0d99,transparent 30%),url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1400&q=85') center/cover;filter:saturate(.5) brightness(.53)}.cover-art:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#090a0d 0%,transparent 42%),linear-gradient(0deg,#090a0d 0%,transparent 35%)}.landing-content{z-index:1;align-self:center;max-width:720px;padding:8vw 6vw 9vw 10vw}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.28em;color:var(--gold);font-weight:700}.wordmark{font:500 clamp(54px,8vw,106px)/.93 Cinzel,serif;letter-spacing:.12em;margin:28px 0 14px;text-shadow:0 4px 26px #000}.subtitle{font:400 18px Cinzel,serif;letter-spacing:.17em;color:#d4c7b5}.rule{height:1px;width:72px;background:var(--red);margin:29px 0}.intro{max-width:430px;color:#b9b0a7;line-height:1.8;font-size:14px}.landing-bottom{display:flex;align-items:center;gap:25px;margin-top:38px}.primary{border:1px solid #b45b4e;background:linear-gradient(135deg,#852d2c,#5a2426);padding:15px 26px;text-transform:uppercase;letter-spacing:.17em;font-size:11px;font-weight:700;box-shadow:0 10px 38px #7c252333;transition:.2s}.primary:hover{background:#a13d39;transform:translateY(-2px)}.hint{color:#817a75;font-size:11px;letter-spacing:.06em}.copyright{position:absolute;bottom:25px;left:10vw;color:#6b6560;font-size:10px;letter-spacing:.13em;text-transform:uppercase;z-index:1}
.game{display:grid;grid-template-columns:230px minmax(0,1fr) 260px;min-height:100vh;background:#0b0c0f}.sidebar{background:#101115;border-right:1px solid #272528;padding:26px 20px;display:flex;flex-direction:column;gap:28px}.brand{font:500 17px Cinzel,serif;letter-spacing:.2em;color:#e4d7c6}.brand span{display:block;color:var(--red);font:700 9px 'DM Sans';letter-spacing:.32em;margin-top:5px}.section-label{font-size:9px;color:#79716c;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}.character{display:flex;gap:12px;align-items:center}.portrait{width:45px;height:45px;border:1px solid #765149;background:linear-gradient(145deg,#322a2b,#16171c);display:grid;place-items:center;color:#c9a492;font:20px Cinzel}.charname{font:14px Cinzel,serif}.charline{font-size:10px;color:#8f8781;margin-top:5px}.meter{margin:11px 0}.meter-head{display:flex;justify-content:space-between;font-size:10px;color:#a49a90;margin-bottom:6px}.meter-track{height:4px;background:#302d2d}.meter-fill{height:100%;transition:width .5s}.health{background:#a74843}.will{background:#798c91}.humanity{background:#c59f67}.nav{display:grid;gap:4px}.nav button{background:transparent;border:0;text-align:left;padding:10px 11px;color:#938b84;font-size:11px;letter-spacing:.05em}.nav button:hover,.nav button.active{background:#1b1a1d;color:#e6d9c8}.nav button.active{border-left:2px solid var(--red)}.navicon{display:inline-block;width:25px;color:#b77c65}.sidebar-foot{margin-top:auto;border-top:1px solid #2a2828;padding-top:15px;color:#726b67;font-size:10px;line-height:1.7}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:58px;border-bottom:1px solid #272528;display:flex;align-items:center;justify-content:space-between;padding:0 27px}.location{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#b5aba1}.clock{font-size:10px;color:#857d76;letter-spacing:.08em}.story-area{padding:27px clamp(22px,5vw,76px) 32px;max-width:980px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column}.chapter{color:var(--gold);font-size:9px;text-transform:uppercase;letter-spacing:.23em}.story-title{font:500 clamp(27px,3.8vw,43px)/1.15 Cinzel,serif;margin:13px 0 18px;color:#eee4d6}.scene{height:clamp(170px,24vw,270px);position:relative;overflow:hidden;margin-bottom:24px;border:1px solid #393032;background:#1a1719}.scene-image{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.55) brightness(.65);transition:background-image .3s}.scene:after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(0deg,#111216,transparent)}.scene-caption{z-index:1;position:absolute;bottom:13px;left:16px;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#d1beb0}.narrative{font:16px/1.85 'DM Sans',sans-serif;color:#c0b7ad;max-width:680px}.narrative p{margin:0 0 15px}.dialogue{color:#e8cdb5;font-style:italic}.speaker{font-size:9px;letter-spacing:.19em;text-transform:uppercase;color:#bd806b;margin:8px 0}.choices{display:grid;gap:8px;margin-top:auto;padding-top:23px}.choice{width:100%;border:1px solid #393332;background:#151518;padding:13px 16px;text-align:left;color:#c9c0b6;font-size:12px;line-height:1.5;transition:.18s}.choice:hover{border-color:#9c5548;background:#21191a;color:#f1e4d3;transform:translateX(3px)}.choice .key{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid #514540;color:var(--gold);margin-right:11px;font-size:10px}.choice small{display:block;color:#857a72;margin:5px 0 0 35px;font-size:10px}.rightbar{border-left:1px solid #272528;background:#101115;padding:25px 19px}.objective{border:1px solid #38312d;padding:15px;background:linear-gradient(140deg,#1b191a,#131418);margin-bottom:24px}.objective .section-label{color:var(--gold)}.objective-title{font:15px Cinzel,serif;margin:4px 0 8px}.objective-copy{font-size:11px;color:#928981;line-height:1.65}.quest-step{font-size:10px;color:#bcae9c;margin-top:11px}.quest-step:before{content:'◈';color:#b2765c;margin-right:8px}.log{font-size:10px;color:#958d85;line-height:1.65}.log-item{padding:10px 0;border-bottom:1px solid #252426}.log-item b{display:block;font-weight:500;color:#c3b8aa;margin-bottom:3px}.item-list{display:grid;gap:9px;font-size:10px;color:#aaa096}.item{border:1px solid #302d2c;padding:9px 10px;background:#151518}.item span{color:var(--gold);margin-right:7px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#292021;border:1px solid #8e5147;color:#e5cdbb;padding:12px 20px;font-size:11px;opacity:0;transition:.3s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;background:#050609eF;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(540px,100%);background:#121317;border:1px solid #4a3733;padding:28px}.modal h2{font:24px Cinzel,serif;margin:0 0 8px}.modal p{color:#a79c92;line-height:1.7;font-size:12px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0}.modal-card{border:1px solid #383230;background:#18181c;padding:13px;cursor:pointer}.modal-card:hover{border-color:#a85248}.modal-card b{font:14px Cinzel}.modal-card small{display:block;color:#8d837a;line-height:1.5;margin-top:7px;font-size:10px}.modal-close{margin-top:5px;border:0;background:transparent;color:#a18d7e;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.ending{max-width:650px;margin:auto;text-align:center;padding:50px 25px}.ending h1{font:42px Cinzel}.ending p{color:#b8aca0;line-height:1.8}.ending .primary{margin-top:20px}
@media(max-width:950px){.game{grid-template-columns:190px minmax(0,1fr)}.rightbar{display:none}.sidebar{padding:22px 15px}.story-area{padding-left:34px;padding-right:34px}}
@media(max-width:650px){.landing{display:block}.cover-art{inset:0;background-position:60% center;opacity:.7}.landing-content{padding:28vh 25px 100px}.wordmark{font-size:59px}.intro{font-size:13px}.copyright{left:25px}.game{display:block;padding-bottom:62px}.sidebar{position:fixed;z-index:5;bottom:0;left:0;right:0;height:62px;padding:0 8px;border-right:0;border-top:1px solid #302c2c;display:flex;flex-direction:row;align-items:center;justify-content:space-around;gap:0}.sidebar .brand,.sidebar .character,.sidebar .meters,.sidebar .section-label,.sidebar-foot{display:none}.nav{display:flex;width:100%;justify-content:space-around}.nav button{padding:10px 5px;text-align:center;font-size:9px}.navicon{display:block;width:auto;font-size:15px;margin-bottom:3px}.topbar{height:47px;padding:0 16px}.story-area{padding:22px 19px 24px}.scene{height:190px}.narrative{font-size:14px}.story-title{font-size:29px}.choices{padding-top:17px}.choice{padding:11px}.modal-grid{grid-template-columns:1fr}.clock{font-size:9px}}
</style>
</head>
<body><div id="app"></div><div class="toast" id="toast"></div><div class="overlay" id="overlay"></div>
<script>
const scenes={
 intro:{chapter:'Prologue · The Unquiet',title:'A city that never sleeps',place:'Port Mercy · The Saint Brigid',image:'photo-1586773860418-d37222d8fce3',caption:'Saint Brigid Hospital · 2:17 AM',text:`<p>Rain taps against the ambulance bay doors. Beneath the fluorescent hum, a stranger's pulse flutters in your throat—not yours. You wake on a gurney with a split lip, a stranger's blood on your hands, and no memory of the last six hours.</p><p>The city outside is all sodium lamps and wet blacktop. Somewhere in the dark, a bell tolls once. The nurse at the desk hasn't noticed you move.</p>`,speaker:'',choices:[['A','Slip out through the ambulance bay.','Keep to the shadows.'],['B','Ask the night nurse what happened.','A face is harder to forget than a lie.'],['C','Follow the copper scent down the hall.','Your new hunger has other plans.']]},
 outside:{chapter:'Chapter I · A Thin Red Line',title:'The hunger underneath',place:'Port Mercy · Rainline District',image:'photo-1524665989156-7790a6df972f',caption:'Rainline District · The old quarter',text:`<p>Cold rain brings the city into focus. Port Mercy rises in layers: old brick, neon, church spires disappearing into fog. Your reflection in a shop window looks almost like you.</p><p>A woman in a red coat waits beneath the awning. She introduces herself as Mara Voss, and says she has been looking for you since before you died. Across the street, a cab idles with its lights off.</p>`,speaker:'MARA VOSS',choices:[['A','Hear Mara out.','She seems to know what you are.'],['B','Take the cab.','Trust no one; find your own answers.'],['C','Ask where you can feed.','The hunger is getting louder.']]},
 mara:{chapter:'Chapter I · A Thin Red Line',title:'The house with no mirrors',place:'Port Mercy · Voss House',image:'photo-1511895426328-dc8714191300',caption:'The Voss House · Somewhere in the city',text:`<p>Mara's townhouse is older than its neighbors and twice as quiet. No mirrors. No clocks. She offers a glass of dark red wine, untouched, and explains the rules: don't draw eyes, don't leave bodies, and never trust a promise made before sunrise.</p><p>Tonight, someone called the Grey Choir has stolen a ledger from the old Rialto Theatre. It contains the names of everyone who has gone missing this month. Mara wants it back. She wants to know why you were found at the scene.</p>`,speaker:'MARA VOSS',choices:[['A','Accept the job.','The ledger could tell you who made you.'],['B','Demand the truth first.','You weren’t born yesterday.'],['C','Refuse—and look for the Choir alone.','You don’t take orders.']]},
 theatre:{chapter:'Chapter II · The Grey Choir',title:'Music for the newly dead',place:'Port Mercy · Rialto Theatre',image:'photo-1503095396549-807759245b35',caption:'The Rialto · Curtains at midnight',text:`<p>The Rialto's marquee has been dark for twenty years. Tonight, a low cello note vibrates through its locked doors. A narrow side entrance stands ajar. Inside, someone moves between the seats, humming a hymn you almost remember.</p><p>You can feel three heartbeats beyond the curtain. One quick and terrified. Two slow, steady, and utterly calm.</p>`,speaker:'',choices:[['A','Slip in unseen.','Let the dark hide you.'],['B','Walk through the front doors.','Make them decide if you’re a threat.'],['C','Use your new gift to listen.','Blood remembers what ears cannot.']]},
 vault:{chapter:'Chapter II · The Grey Choir',title:'The ledger of the lost',place:'Port Mercy · Rialto Backstage',image:'photo-1531251445707-1f000e1f2d9f',caption:'Beneath the stage · The old vault',text:`<p>Behind the velvet curtain, an iron stairway descends beneath the stage. The ledger rests on a plinth inside a circle of salt. Its pages are filled with names, dates, and a single mark beside your own: <em>the unclaimed.</em></p><p>A voice rises from the shadows. “They told us you were gone for good.” A pale man steps into view, and behind him, the same terrified heartbeat starts running.</p>`,speaker:'ELIAS, OF THE GREY CHOIR',choices:[['A','Offer a bargain.','Find out who wrote your name.'],['B','Command him to stand down.','Your voice carries a strange weight.'],['C','Lunge for the ledger.','Take what you came for.']]},
 finale:{chapter:'Chapter III · All Debts Come Due',title:'The first choice is yours',place:'Port Mercy · The Rialto',image:'photo-1493246507139-91e8fad9978e',caption:'Dawn is still a long way off',text:`<p>The ledger is warm in your hands. Every name in it is a life that slipped through the city's cracks—and a thread leading back to the one who made you. Elias watches, waiting. Somewhere above, the terrified heartbeat has gone quiet.</p><p>By dawn, someone will come asking what happened here. Your first night is almost over. Your real unlife is just beginning.</p>`,speaker:'',choices:[['A','Give the ledger to Mara.','Honor the bargain.'],['B','Keep it—and disappear.','No one owns your future.'],['C','Offer it to Elias in exchange for the truth.','Make a dangerous ally.']]}
};
let state={scene:'intro',health:100,will:70,humanity:80,blood:1,clue:0,inventory:['A torn hospital bracelet'],logs:['You woke beneath the city lights.'],started:false,ending:false};
const image=(id)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=1200&q=80`;
function render(){const app=document.getElementById('app');if(!state.started){app.innerHTML=`<main class="screen landing"><div class="cover-art"></div><section class="landing-content"><div class="eyebrow">A narrative roleplaying game</div><div class="wordmark">NOCTURNE</div><div class="subtitle">THE VEIL OF ASH</div><div class="rule"></div><p class="intro">You died tonight. The city has a thousand stories about what comes after. This one is yours. In Port Mercy, every secret has a price—and hunger always collects.</p><div class="landing-bottom"><button class="primary" onclick="begin()">Begin your unlife&nbsp; →</button><span class="hint">A short, choice-driven RPG</span></div></section><div class="copyright">An original tale of shadows · 2025</div></main>`;return}if(state.ending){renderEnding();return}const s=scenes[state.scene];app.innerHTML=`<main class="game"><aside class="sidebar"><div class="brand">NOCTURNE<span>THE VEIL OF ASH</span></div><div><div class="section-label">Your new self</div><div class="character"><div class="portrait">♱</div><div><div class="charname">The Unclaimed</div><div class="charline">Kindred · Newborn</div></div></div><div class="meters"><div class="meter"><div class="meter-head"><span>VITALITY</span><span>${state.health}%</span></div><div class="meter-track"><div class="meter-fill health" style="width:${state.health}%"></div></div></div><div class="meter"><div class="meter-head"><span>WILL</span><span>${state.will}%</span></div><div class="meter-track"><div class="meter-fill will" style="width:${state.will}%"></div></div></div><div class="meter"><div class="meter-head"><span>HUMANITY</span><span>${state.humanity}%</span></div><div class="meter-track"><div class="meter-fill humanity" style="width:${state.humanity}%"></div></div></div></div></div><div><div class="section-label">The night</div><nav class="nav"><button class="active" onclick="nav('story')"><span class="navicon">◉</span>Story</button><button onclick="nav('journal')"><span class="navicon">▤</span>Journal</button><button onclick="nav('inventory')"><span class="navicon">◇</span>Inventory</button><button onclick="nav('disciplines')"><span class="navicon">✧</span>Disciplines</button></nav></div><div class="sidebar-foot">PORT MERCY<br>Wednesday, 2:17 AM<br><span style="color:#a0524a">●</span> The Veil is holding</div></aside><section class="main"><header class="topbar"><span class="location">${s.place}</span><span class="clock">☾ &nbsp; NIGHT ${state.scene==='intro'?'01':'01'} &nbsp; · &nbsp; 2:17 AM</span></header><article class="story-area"><div class="chapter">${s.chapter}</div><h1 class="story-title">${s.title}</h1><div class="scene"><div class="scene-image" style="background-image:url('${image(s.image)}')"></div><div class="scene-caption">${s.caption}</div></div><div class="narrative">${s.text}${s.speaker?`<div class="speaker">${s.speaker}</div>`:''}</div><div class="choices">${s.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><span class="key">${c[0]}</span>${c[1]}<small>${c[2]}</small></button>`).join('')}</div></article></section><aside class="rightbar"><div class="objective"><div class="section-label">Current objective</div><div class="objective-title">${objectiveTitle()}</div><div class="objective-copy">${objectiveText()}</div><div class="quest-step">${state.scene==='intro'?'Get out of Saint Brigid':state.scene==='outside'?'Decide who to trust':state.scene==='mara'?'Recover the stolen ledger':state.scene==='theatre'?'Find the ledger beneath the stage':state.scene==='vault'?'Decide what to do with the ledger':'Choose what comes next'}</div></div><div class="section-label">Recent memories</div><div class="log">${state.logs.slice(-4).reverse().map(x=>`<div class="log-item">${x}</div>`).join('')}</div><div class="section-label" style="margin-top:25px">Carried</div><div class="item-list">${state.inventory.map(x=>`<div class="item"><span>◇</span>${x}</div>`).join('')}</div></aside></main>`}
function begin(){state.started=true;log('The night begins at Saint Brigid.');render()}
function objectiveTitle(){return state.scene==='intro'?'Leave the hospital':state.scene==='outside'?'Find your footing':state.scene==='mara'?'The missing ledger':state.scene==='theatre'?'Enter the Rialto':state.scene==='vault'?'Confront Elias':'Make your choice'}function objectiveText(){return state.scene==='intro'?'You are not safe here. Get out before someone notices you are awake.':state.scene==='outside'?'A stranger offers answers. The cab offers distance. Hunger offers nothing.':state.scene==='mara'?'Mara says the Grey Choir has a ledger that may explain your return.':state.scene==='theatre'?'Find a way inside and locate the stolen ledger.':'The ledger holds the names of the lost—and your own.'}
function log(text){state.logs.push(text)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)}
function choose(i){const key=state.scene;const s=scenes[key];const c=s.choices[i];if(key==='intro'){if(i===0){state.will+=8;log('You escaped through the ambulance bay.');state.scene='outside'}else if(i===1){state.humanity+=6;state.inventory.push('Saint Brigid visitor pass');log('A nurse whispered a name: Mara Voss.');state.scene='outside'}else{state.blood++;state.humanity-=10;state.health-=8;log('You followed the scent. The hunger quieted, but not your conscience.');state.scene='outside'}}else if(key==='outside'){if(i===0){state.scene='mara';state.clue++ ;log('Mara Voss offered you a place in her house.')}else if(i===1){state.will-=8;state.inventory.push('Taxi chit');log('You let the cab take you to the old Rialto.');state.scene='theatre'}else{state.blood++;state.humanity-=7;state.scene='mara';log('You fed in the rain. The night became easier to hear.')}}else if(key==='mara'){if(i===0){state.scene='theatre';state.inventory.push('Brass key to the Rialto');log('You accepted Mara’s bargain.')}else if(i===1){state.clue++;state.will-=5;state.scene='theatre';log('Mara admitted she knew who left you for dead.')}else{state.humanity+=3;state.scene='theatre';log('You set off alone for the Rialto.')}}else if(key==='theatre'){if(i===0){state.will+=10;log('You entered without a sound.');state.scene='vault'}else if(i===1){state.health-=5;state.clue++;log('You announced yourself. The Choir did not attack.');state.scene='vault'}else{state.blood=Math.max(0,state.blood-1);state.clue+=2;state.will+=7;log('You read the heartbeats through the wall.');state.scene='vault'}}else if(key==='vault'){if(i===0){state.humanity+=5;state.scene='finale';log('You offered Elias a deal instead of a fight.');state.inventory.push('Elias’s silver sigil')}else if(i===1){state.will-=12;state.scene='finale';log('Your voice filled the vault. Elias lowered his eyes.')}else{state.health-=14;state.humanity-=8;state.scene='finale';log('You seized the ledger. The Choir will remember.');state.inventory.push('The Grey Choir ledger')}}else if(key==='finale'){if(i===0){state.humanity+=8;log('You gave Mara the ledger.');state.inventory.push('Mara’s promise')}else if(i===1){state.will+=5;log('You vanished with the ledger.');if(!state.inventory.includes('The Grey Choir ledger'))state.inventory.push('The Grey Choir ledger')}else{state.clue+=1;log('You offered Elias the ledger for the truth.');state.inventory.push('Elias’s secret')}state.ending=true;renderEnding();return}state.health=Math.max(10,Math.min(100,state.health));state.will=Math.max(10,Math.min(100,state.will));state.humanity=Math.max(10,Math.min(100,state.humanity));toast(['The night remembers.','Your choice leaves a mark.','Something stirs in the dark.'][Math.floor(Math.random()*3)]);render()}
function renderEnding(){document.getElementById('app').innerHTML=`<main class="screen landing"><div class="cover-art"></div><section class="ending"><div class="eyebrow">End of the beginning</div><h1>${state.humanity<45?'A darker kind of dawn':state.humanity>84?'Still almost human':'The night is yours'}</h1><div class="rule" style="margin:24px auto"></div><p>Your first night in Port Mercy is over. The city has learned your name; you have learned what it costs to keep it. The ledger is only one thread in a much older web, and the sun is already looking for you.</p><p style="color:#7d746d;font-size:11px">Vitality ${state.health}% &nbsp;·&nbsp; Will ${state.will}% &nbsp;·&nbsp; Humanity ${state.humanity}%</p><button class="primary" onclick="resetGame()">Begin again&nbsp; ↺</button></section><div class="copyright">NOCTURNE · THE VEIL OF ASH</div></main>`}
function resetGame(){state={scene:'intro',health:100,will:70,humanity:80,blood:1,clue:0,inventory:['A torn hospital bracelet'],logs:['You woke beneath the city lights.'],started:false,ending:false};render()}
function nav(which){let title,copy;if(which==='journal'){title='Journal';copy=`<p><b>The Unquiet.</b> You came to in Saint Brigid Hospital with no memory of your death.</p><p><b>People.</b> Mara Voss offered answers in return for a stolen ledger. Elias and the Grey Choir stand between you and the truth.</p><p><b>Recent memories.</p><ul>${state.logs.map(x=>`<li>${x}</li>`).join('')}</ul>`}else if(which==='inventory'){title='Inventory';copy=`<p>Everything you carry into the night.</p><div class="item-list">${state.inventory.map(x=>`<div class="item"><span>◇</span>${x}</div>`).join('')}</div><p style="margin-top:20px">Blood reserve: ${state.blood} ${state.blood===1?'drop':'drops'}</p>`}else if(which==='disciplines'){title='Disciplines';copy=`<p>Your blood is young, but it remembers.</p><div class="modal-card"><b>Auspex · Heightened Senses</b><small>Listen past walls and read the echoes in another’s blood. Used once in the Rialto.</small></div><div class="modal-card"><b>Presence · Command</b><small>Make your voice impossible to ignore. It may open a door—or make an enemy.</small></div><p style="margin-top:12px">Will: ${state.will}% · Blood: ${state.blood}</p>`}else{return}document.getElementById('overlay').innerHTML=`<div class="modal"><div class="eyebrow">The unclaimed</div><h2>${title}</h2>${copy}<button class="modal-close" onclick="closeModal()">← Return to the night</button></div>`;document.getElementById('overlay').classList.add('show')}
function closeModal(){document.getElementById('overlay').classList.remove('show')}
document.addEventListener('keydown',e=>{if(document.getElementById('overlay').classList.contains('show')){if(e.key==='Escape')closeModal();return}if(!state.started||state.ending)return;const s=scenes[state.scene];const n='abc'.indexOf(e.key.toLowerCase());if(n>=0&&n<s.choices.length)choose(n)});render();
</script></body></html>
